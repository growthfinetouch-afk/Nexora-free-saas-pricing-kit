<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage-Based Slider Pricing Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Estimate Your Monthly Cost</h1>
                <p class="text-lg text-gray-600">Drag the slider to calculate your estimated bill based on your usage.</p>
            </div>

            <div x-data="{ usage: 5000, baseCost: 50, costPerUnit: 0.01, get totalCost() { return (this.baseCost + (this.usage * this.costPerUnit)).toFixed(2) } }" class="space-y-8">
                <!-- Usage Slider -->
                <div>
                    <label for="usage-slider" class="block text-xl font-semibold text-gray-700 mb-4 flex justify-between items-center">
                        <span>API Calls per Month: <span x-text="usage"></span></span>
                        <span class="text-indigo-600 text-2xl font-bold" x-text="`$${totalCost}`"></span>
                    </label>
                    <input type="range" id="usage-slider" name="usage" x-model="usage" min="0" max="100000" step="1000"
                           class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer range-lg accent-indigo-600">
                    <div class="flex justify-between text-sm text-gray-500 mt-2">
                        <span>0</span>
                        <span>100k+</span>
                    </div>
                </div>

                <!-- Breakdown (Optional) -->
                <div class="border-t border-gray-200 pt-6">
                    <h3 class="text-2xl font-bold text-gray-900 mb-4">Cost Breakdown</h3>
                    <ul class="space-y-3 text-lg text-gray-700">
                        <li class="flex justify-between">
                            <span>Base Subscription:</span>
                            <span x-text="`$${baseCost.toFixed(2)}`"></span>
                        </li>
                        <li class="flex justify-between">
                            <span>Usage Cost (<span x-text="usage"></span> API Calls @ $<span x-text="costPerUnit.toFixed(2)"></span>/call):</span>
                            <span x-text="`$${(usage * costPerUnit).toFixed(2)}`"></span>
                        </li>
                        <li class="flex justify-between font-bold text-gray-900 text-xl pt-2 border-t border-gray-200">
                            <span>Estimated Total:</span>
                            <span x-text="`$${totalCost}`"></span>
                        </li>
                    </ul>
                </div>

                <button class="w-full bg-indigo-600 text-white rounded-lg px-6 py-3 text-lg font-semibold hover:bg-indigo-700 transition-all duration-300 transform hover:scale-105 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Start with this Plan
                </button>
            </div>
        </div>
    </div>
</body>
</html>
